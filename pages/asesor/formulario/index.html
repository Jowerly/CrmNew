<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
        <div class="dashboard-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="logo">
                    <a href="/pages/dashboard/index.html"><img src="logo.png" alt="Logo" class="logo-img">
                    <span class="logo-title">B Mobile</span>
                    </a>
                </div>
            </div>
            <nav class="menu">
                <ul>
                    <li class="menu-link active">
                        <a href="/pages/asesor/dashboard/index.html"><i class="bi bi-house-door-fill"></i></i><span>Dashboard</span></a>
                    </li>
                    <li class="menu-link">
                        <a href="/pages/asesor/MisGestiones/index.html"><i class="bi bi-briefcase-fill"></i></i><span>Mis Gestiones</span></a>
                    </li>
                    <li class="menu-link">
                        <a href="/pages/asesor/Funnel/index.html"><i class="bi bi-clock-history"></i><span>Funnel</span></a>
                    </li>
                    <li class="menu-link">
                        <a href="/pages/asesor/calendario/public/index.html"><i class="bi bi-file-earmark-text-fill"></i><span>Calendario</span></a>
                    </li>
                    <li class="menu-link">
                        <a href="/pages/asesor/formulario/index.html"><i class="bi bi-ui-radios"></i><span>Formulario Soporte</span></a>
                    </li>
                    <li class="menu-link">
                        <a href="/pages/asesor/speech/index.html"><i class="bi bi-volume-up-fill"></i><span>Speech</span></a>
                    </li>
                    <li class="menu-link">
                        <a href="/pages/asesor/information/index.html"><i class="bi bi-info-square-fill"></i><span>Informacion planes</span></a>
                    </li>
                </ul>

                <button class="btn-toggle" id="btnToggleSidebar" title="Fijar/ocultar menú">
                    <i class="bi bi-lock-fill"></i>
                </button>

                <div class="user-card" id="user">
                    <a href="#">
                        <span class="user-avatar"><i class="bi bi-person-fill"></i></span>
                        <span class="user-info">
                            <span class="user-name">Mi cuenta</span>
                            <span class="user-role">Ver perfil</span>
                        </span>
                    </a>
                </div>
            </nav>
        </aside>
        <main class="main-content">
            <section class="formulario">
                <h1><i class="bi bi-ui-checks"></i>Formulario Soporte Tecnico</h1>
                <form action="" method="post" class="formulario">
                <label for="nombre">Nombre:</label>
                <input type="text" required>
                <label for="apellido">Apellido:</label>
                <input type="text" required>
                <label for="Dni">Ingrese su DNI </label>
                <input type="number" required>
                <select name="Area" id="Area">
                    <option value="Ventas">Ventas</option>
                    <option value="Recursos-humanos">Recursos Humanos</option>
                    <option value="Supervisores">Supervisores</option>
                    <option value="Gerencia">Gerencia</option>
                    <option value="Ventas-mayores">Ventass mayores</option>
                    <option value="mesa-control">Mesa de Control</option>
                
                </select>
                <div class="tipo-ayuda">
                        <h1>Tipo de solicitud</h1>
                    <div class="alinear-solicitud"> 
                        <input type="radio"> 
                        <label for="base">Cargar Base</label>
                    </div>
                   <div class="alinear-solicitud"> 
                        <input type="radio"> 
                        <label for="CRM">Problema CMR/ Red</label>
                    </div>
                    <div class="alinear-solicitud"> 
                        <input type="radio"> 
                        <label for="hardware">Hardware</label>
                    </div>
                    <div class="alinear-solicitud"> 
                        <input type="radio"> 
                        <label for="otros">Otros (detallar en la seccion de abajo)</label>
                    </div>
                      <div class="alinear-solicitud"> 
                        <textarea class="detalle" cols="5" rows="10"></textarea>
                    </div>
                     <div class="alinear-solicitud"> 
                        <input type="submit" value="POST">
                    </div>
                </div>
                </form>
            </section>
        </main>
        </div>
</body>
<script src="script.js"></script>
</html>
